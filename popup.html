<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #fff;
    color: #18191c;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .header .logo { font-size: 18px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #status { font-size: 14px; }
  .section-title {
    margin: 14px 0 6px;
    font-size: 12px;
    font-weight: 600;
    color: #61666d;
  }
  .up-list { max-height: 160px; overflow-y: auto; }
  .up-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .up-item:hover { background: #f6f7f8; }
  .up-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-del {
    border: none;
    background: none;
    color: #9499a0;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .up-del:hover { background: #fbe8ee; color: #fb7299; }
  .up-restore {
    border: none;
    background: none;
    color: #9499a0;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .up-restore:hover { background: #e8f4e8; color: #2ac864; }
  .up-empty { font-size: 12px; color: #9499a0; padding: 4px 0 0; }
  .add-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-row input {
    flex: 1;
    min-width: 0;
    padding: 5px 8px;
    font-size: 12px;
    border: 1px solid #e3e5e7;
    border-radius: 6px;
    outline: none;
  }
  .add-row input:focus { border-color: #fb7299; }
  .add-row input.err { border-color: #f25d8e; background: #fff5f8; }
  .add-row button {
    padding: 5px 12px;
    font-size: 12px;
    color: #fff;
    background: #fb7299;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-row button:disabled { opacity: 0.6; cursor: default; }
  .tip {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #f1f2f3;
    font-size: 12px;
    color: #9499a0;
    line-height: 1.6;
  }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background: #c9ccd0;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .switch input:checked + .slider { background: #fb7299; }
  .switch input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>
  <div class="header"><span class="logo">🧘</span><span>BiliZen · 禅模式看B站</span></div>
  <div class="row">
    <span id="status">评论区显示中</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="section-title">拉黑UP主 <span id="upCount"></span></div>
  <div id="upList" class="up-list"></div>
  <div class="add-row">
    <input id="upInput" type="text" placeholder="UID 或 UP主主页链接">
    <button id="upAdd">拉黑</button>
  </div>
  <div class="section-title">已删除推荐视频 <span id="rmCount"></span></div>
  <div id="rmList" class="up-list"></div>
  <div class="tip">在UP主名字上右键选「BiliZen：拉黑该UP主」；鼠标悬停右栏推荐卡片点 ✕ 可删除单条推荐。二者均立即生效。</div>
  <script src="popup.js"></script>
</body>
</html>
